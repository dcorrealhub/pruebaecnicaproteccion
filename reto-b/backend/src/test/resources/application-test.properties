# Pruebas de integración contra PostgreSQL real (servicio postgres-test de reto-b/docker-compose.yml).
# Local:      docker compose up -d postgres-test   y luego   mvn test
# Contenedor: docker compose run --rm backend-tests (sobreescribe la URL con SPRING_DATASOURCE_URL)
spring.datasource.url=jdbc:postgresql://localhost:5433/proteccion_reto_test
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway aplica las migraciones reales; Hibernate solo valida el esquema
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
