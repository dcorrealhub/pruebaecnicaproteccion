spring.application.name=reto-b

# Credenciales de la base de datos: se leen del archivo .env (en reto-b/backend, ver .env.example)
# o de variables de entorno con el mismo nombre. Las variables de entorno tienen prioridad.
# Los valores por defecto solo sirven para un PostgreSQL local de desarrollo.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/proteccion_reto}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
# Sin sesion JPA abierta durante el render HTTP: las transacciones viven solo en los casos de uso
spring.jpa.open-in-view=false

# Flyway gestiona el esquema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
# Nunca exponer trazas ni mensajes internos en las respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never

# Montos en COP.
# El tope mensual y el umbral de revision de cada afiliado viven en la tabla parametro_afiliado;
# estos valores son los que aplican cuando el afiliado no tiene uno propio configurado.
aporte.tope-mensual=10000000
aporte.umbral-revision=5000000
# Canales de mayor riesgo: su umbral prevalece sobre el del afiliado y sobre el umbral por defecto
aporte.umbral-revision-por-canal.SUCURSAL=3000000
# Zona en la que se determina la fecha (y el periodo) de un aporte
aporte.zona-horaria=America/Bogota
