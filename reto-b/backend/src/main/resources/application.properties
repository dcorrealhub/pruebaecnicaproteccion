spring.application.name=reto-b

# PostgreSQL — levanta con: docker compose up -d (desde la raiz del proyecto)
spring.datasource.url=jdbc:postgresql://localhost:5432/proteccion_reto
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway gestiona el esquema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8082

# Tope mensual y umbrales de revision son configurables.
# El umbral por defecto aplica a todos los canales; SUCURSAL tiene un umbral mas bajo (mayor riesgo).
aporte.tope-mensual=10000000
aporte.umbral-revision=5000000
aporte.umbral-revision-sucursal=3000000

# Observabilidad: incluir el id de correlacion en cada linea de log.
# No se loguean datos sensibles (monto, afiliado).
logging.pattern.level=%5p [correlationId=%X{correlationId:-}]
