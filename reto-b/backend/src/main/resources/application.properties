spring.application.name=reto-b

# PostgreSQL — levanta con: docker compose up -d (desde la raiz del proyecto)
spring.datasource.url=jdbc:postgresql://localhost:5432/proteccion_reto
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway gestiona el esquema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8082

# Tope mensual y umbral de revision son configurables
aporte.tope-mensual=10000000
# Umbral de revision por defecto y excepciones por canal (mapa SpEL: {CANAL:'monto', ...})
aporte.umbral-revision=5000000
aporte.umbral-revision.por-canal={SUCURSAL:'3000000'}
# Rango maximo de meses en la consulta del consolidado
aporte.consulta-rango-maximo-meses=12
# Zona horaria del negocio para calcular "hoy" (validacion de fecha futura)
aporte.zona-horaria=America/Bogota